<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --white: #ffffff; --black: #0d0d0d; --gray-50: #fafafa;
    --gray-100: #f5f5f5; --gray-200: #e8e8e8; --gray-400: #9a9a9a;
    --gray-600: #555555; --gray-800: #1e1e1e; --line: #e8e8e8;
    --hatch: #e9ecee; 
    --font: 'DM Sans', -apple-system, sans-serif;
    --display: 'Syne', sans-serif;
  }
  html { scroll-behavior: smooth; }
  body { font-family: var(--font); background: var(--white); color: var(--black); font-size: 15px; line-height: 1.6; overflow-x: hidden; }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px; height: 60px;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(12px);
    border-bottom: 0.5px solid var(--line);
    transition: box-shadow 0.3s;
  }
  nav.scrolled { box-shadow: 0 1px 24px rgba(0,0,0,0.06); }
  
  .nav-logo { display: flex; align-items: center; text-decoration: none; color: var(--black); transition: opacity 0.2s; }
  .nav-logo:hover { opacity: 0.65; }
  .nav-logo-svg { display: block; height: 30px; width: auto; color: var(--black); }
  .nav-links { display: flex; gap: 32px; list-style: none; }
  .nav-links a { font-size: 14px; color: var(--gray-600); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: var(--black); }
  .nav-back { font-size: 13px; color: var(--gray-600); text-decoration: none; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
  .nav-back:hover { color: var(--black); }

  .hatch-section {
    background-image: repeating-linear-gradient(116deg, var(--hatch) 0px, var(--hatch) 0.5px, transparent 0.5px, transparent 14.7px);
    background-color: var(--white);
  }

  /* ── SECTION DIVIDER ── */
  .section-divider { line-height: 0; overflow: hidden; background: var(--white); }
  .section-divider svg { display: block; width: 100%; }

  /* HERO */
  .cs-hero { padding: 100px 40px 0; border-bottom: 0.5px solid var(--line); }
  .cs-hero-inner { max-width: 1100px; margin: 0 auto; }
  .cs-breadcrumb { font-size: 12px; color: var(--gray-400); margin-bottom: 32px; display: flex; align-items: center; gap: 8px; }
  .cs-breadcrumb a { color: var(--gray-400); text-decoration: none; }
  .cs-breadcrumb a:hover { color: var(--black); }
  .cs-hero-grid { display: grid; grid-template-columns: 1fr 340px; gap: 80px; align-items: start; padding-bottom: 60px; }
  .cs-tag { font-size: 11px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--gray-400); margin-bottom: 20px; }
  .cs-hero h1 { font-size: 48px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 20px; }
  .cs-hero h1 em { font-style: italic; font-weight: 300; color: var(--gray-400); }
  .cs-hero-desc { font-size: 16px; color: var(--gray-600); line-height: 1.8; }

  /* Meta card */
  .cs-meta-card { border: 0.5px solid var(--line); border-radius: 16px; overflow: hidden; }
  .cs-meta-row { padding: 16px 20px; border-bottom: 0.5px solid var(--line); }
  .cs-meta-row:last-child { border-bottom: none; }
  .cs-meta-label { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gray-400); margin-bottom: 4px; }
  .cs-meta-value { font-size: 14px; color: var(--black); }
  .cs-meta-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .cs-meta-pill { font-size: 11px; color: var(--gray-600); border: 0.5px solid var(--line); padding: 3px 8px; border-radius: 20px; background: var(--gray-50); }

  /* COVER IMAGE */
  .cs-cover { width: 100%; background: var(--gray-100); display: flex; align-items: center; justify-content: center; aspect-ratio: 21/9; border-bottom: 0.5px solid var(--line); }

  /* CONTENT */
  .cs-content { max-width: 720px; margin: 0 auto; padding: 80px 40px; }
  .cs-section { margin-bottom: 64px; }
  .cs-section-label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gray-400); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .cs-section-label::before { content: ''; display: inline-block; width: 16px; height: 1px; background: var(--gray-400); }
  .cs-section h2 { font-size: 28px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.3; margin-bottom: 16px; }
  .cs-section h2 em { font-style: italic; font-weight: 300; color: var(--gray-400); }
  .cs-section p { font-size: 15px; color: var(--gray-600); line-height: 1.85; margin-bottom: 16px; }
  .cs-section p:last-child { margin-bottom: 0; }

  /* Highlight box */
  .cs-highlight { border-left: 2px solid var(--black); padding: 20px 24px; background: var(--gray-50); border-radius: 0 12px 12px 0; margin: 28px 0; }
  .cs-highlight p { font-size: 16px; color: var(--black); font-weight: 400; line-height: 1.7; margin: 0; }

  /* Problem / Solution split */
  .cs-split { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 0.5px solid var(--line); border-radius: 16px; overflow: hidden; margin: 28px 0; }
  .cs-split-item { background: var(--white); padding: 28px; }
  .cs-split-item h3 { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gray-400); margin-bottom: 12px; }
  .cs-split-item p { font-size: 14px; color: var(--gray-600); line-height: 1.7; margin: 0; }

  /* Process steps */
  .cs-steps { display: flex; flex-direction: column; gap: 0; border: 0.5px solid var(--line); border-radius: 16px; overflow: hidden; margin: 28px 0; }
  .cs-step { display: grid; grid-template-columns: 56px 1fr; gap: 0; border-bottom: 0.5px solid var(--line); }
  .cs-step:last-child { border-bottom: none; }
  .cs-step-num { border-right: 0.5px solid var(--line); display: flex; align-items: flex-start; justify-content: center; padding-top: 24px; font-size: 11px; color: var(--gray-400); font-weight: 500; }
  .cs-step-body { padding: 20px 24px; }
  .cs-step-body h3 { font-size: 14px; font-weight: 500; color: var(--black); margin-bottom: 6px; }
  .cs-step-body p { font-size: 13px; color: var(--gray-600); line-height: 1.7; margin: 0; }

  /* Outcome stats */
  .cs-outcomes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 0.5px solid var(--line); border-radius: 16px; overflow: hidden; margin: 28px 0; }
  .cs-outcome { background: var(--white); padding: 24px; }
  .cs-outcome-num { font-size: 36px; font-weight: 500; letter-spacing: -0.03em; color: var(--black); line-height: 1; margin-bottom: 6px; }
  .cs-outcome-label { font-size: 12px; color: var(--gray-600); }

  /* Full-width image placeholder */
  .cs-img-full { width: 100%; aspect-ratio: 16/9; background: var(--gray-100); border-radius: 16px; border: 0.5px solid var(--line); display: flex; align-items: center; justify-content: center; margin: 28px 0; }
  .cs-img-full-label { font-size: 12px; color: var(--gray-400); }
  .cs-img-half-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 28px 0; }
  .cs-img-half { aspect-ratio: 4/3; background: var(--gray-100); border-radius: 12px; border: 0.5px solid var(--line); display: flex; align-items: center; justify-content: center; }
  .cs-img-half .cs-img-full-label { font-size: 11px; }

  /* Nav next/prev */
  .cs-nav { border-top: 0.5px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; }
  .cs-nav-item { padding: 32px 40px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; transition: background 0.2s; }
  .cs-nav-item:hover { background: var(--gray-50); }
  .cs-nav-item:first-child { border-right: 0.5px solid var(--line); }
  .cs-nav-dir { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gray-400); }
  .cs-nav-title { font-size: 16px; font-weight: 500; color: var(--black); }

  footer { border-top: 0.5px solid var(--line); padding: 32px 40px; display: flex; align-items: center; justify-content: space-between; }
  .footer-name { font-size: 14px; font-weight: 500; color: var(--black); }
  .footer-copy { font-size: 13px; color: var(--gray-400); }
  .footer-links { display: flex; gap: 24px; list-style: none; }
  .footer-links a { font-size: 13px; color: var(--gray-400); text-decoration: none; transition: color 0.2s; }
  .footer-links a:hover { color: var(--black); }


  /* ── MOBILE NAV ── */
  .nav-menu-btn {
    display: none; background: none; border: none; cursor: pointer;
    padding: 8px; flex-direction: column; gap: 5px; z-index: 200;
    align-items: center; justify-content: center;
    min-width: 44px; min-height: 44px; border-radius: 8px;
  }
  .nav-menu-btn:hover { background: rgba(0,0,0,0.04); }
  .nav-menu-btn span { display: block; width: 20px; height: 1.5px; background: var(--black); border-radius: 2px; transition: all 0.25s; }
  .nav-menu-btn.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
  .nav-menu-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
  .nav-menu-btn.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
  .mobile-nav-drawer {
    position: fixed; top: 60px; left: 0; right: 0;
    height: calc(100dvh - 60px);
    background: rgba(255,255,255,0.98); backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 150; transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column; padding: 32px 28px 40px;
    overflow-y: auto; box-sizing: border-box;
  }
  .mobile-nav-drawer.open { transform: translateX(0); }
  .mobile-nav-drawer a {
    font-size: 22px; font-weight: 500; letter-spacing: -0.02em;
    color: var(--black); text-decoration: none; padding: 18px 0;
    border-bottom: 0.5px solid var(--line); transition: opacity 0.15s;
    display: block;
  }
  .mobile-nav-drawer a:last-child { border-bottom: none; }
  .mobile-nav-drawer a:active { opacity: 0.5; }
  .mobile-nav-overlay {
    display: none; position: fixed; inset: 0; top: 60px;
    background: rgba(0,0,0,0.18); z-index: 140;
  }
  .mobile-nav-overlay.open { display: block; }

  @media (max-width: 768px) {
    nav { padding: 0 20px; }
    .nav-links, .nav-back { display: none !important; }
    .nav-menu-btn { display: flex !important; }
    .cs-hero { padding: 80px 20px 0; }
    .cs-hero-grid { grid-template-columns: 1fr; gap: 28px; padding-bottom: 40px; }
    .cs-hero h1 { font-size: 28px; }
    .cs-hero-desc { font-size: 14px; }
    .cs-meta-card { font-size: 13px; }
    .cs-content { padding: 48px 20px; }
    .cs-section h2 { font-size: 22px; }
    .cs-split { grid-template-columns: 1fr; }
    .cs-outcomes { grid-template-columns: 1fr 1fr; }
    .cs-img-half-grid { grid-template-columns: 1fr; }
    .cs-nav { grid-template-columns: 1fr; }
    .cs-nav-item { padding: 24px 20px; }
    .cs-nav-item:first-child { border-right: none; border-bottom: 0.5px solid var(--line); }
    footer { flex-direction: column; gap: 16px; text-align: center; padding: 24px 20px; }
    .footer-links { flex-wrap: wrap; justify-content: center; gap: 16px; }
  }
  @media (max-width: 420px) {
    .cs-outcomes { grid-template-columns: 1fr; }
  }


  /* ── CURSOR ── */
  #cursor-dot { width:6px;height:6px;border-radius:50%;background:var(--black);position:fixed;top:0;left:0;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);will-change:transform;transition:width .2s,height .2s; }
  #cursor-ring { width:28px;height:28px;border-radius:50%;border:1px solid rgba(10,10,10,0.3);position:fixed;top:0;left:0;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);will-change:transform;transition:width .25s,height .25s; }
  body.cursor-hover #cursor-dot { width:10px;height:10px; }
  body.cursor-hover #cursor-ring { width:44px;height:44px;border-color:rgba(10,10,10,0.15); }
  @media (hover:none) { #cursor-dot,#cursor-ring { display:none; } }

  /* ── SCROLL REVEAL ── */
  .reveal { opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease; }
  .reveal.visible { opacity:1;transform:translateY(0); }
  .reveal-delay-1 { transition-delay:.08s; }
  .reveal-delay-2 { transition-delay:.16s; }
  .reveal-delay-3 { transition-delay:.24s; }

</style>
</head>

function renderMockCover(bg) {
  return `<div class="cs-cover hatch-section" style="background:${bg};">
    <div style="font-size:13px;color:var(--gray-400);">[ Project visuals — replace with actual screenshots ]</div>
  </div>`;
}

function renderSection(s) {
  let html = `<div class="cs-section">`;
  if (s.label) html += `<div class="cs-section-label">${s.label}</div>`;
  if (s.heading) html += `<h2>${s.heading}</h2>`;
  if (s.body) html += `<p>${s.body}</p>`;
  if (s.highlight) html += `<div class="cs-highlight"><p>${s.highlight}</p></div>`;
  if (s.split) {
    html += `<div class="cs-split">
      <div class="cs-split-item"><h3>Problem</h3><p>${s.split.problem}</p></div>
      <div class="cs-split-item"><h3>Solution</h3><p>${s.split.solution}</p></div>
    </div>`;
  }
  if (s.steps) {
    html += `<div class="cs-steps">`;
    s.steps.forEach((step, i) => {
      html += `<div class="cs-step">
        <div class="cs-step-num">0${i+1}</div>
        <div class="cs-step-body"><h3>${step.title}</h3><p>${step.body}</p></div>
      </div>`;
    });
    html += `</div>`;
  }
  if (s.outcomes) {
    html += `<div class="cs-outcomes">`;
    s.outcomes.forEach(o => {
      html += `<div class="cs-outcome"><div class="cs-outcome-num">${o.num}</div><div class="cs-outcome-label">${o.label}</div></div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

// ── Render from static CASES data ──
function renderStatic(id) {
  const data = CASES[id];
  const root = document.getElementById('cs-root');
  if (!data) { renderNotFound(root); return; }
  document.title = `${data.title} — Zacky Hilmi`;
  const toolPills = data.meta.Tools.map(t => `<span class="cs-meta-pill">${t}</span>`).join('');
  const typePills = data.meta.Type.map(t => `<span class="cs-meta-pill">${t}</span>`).join('');
  root.innerHTML = buildHTML({
    tag: data.tag, title: data.title,
    subtitle: data.subtitle, desc: data.desc,
    metaRows: `
      <div class="cs-meta-row"><div class="cs-meta-label">Client</div><div class="cs-meta-value">${data.meta.Client}</div></div>
      <div class="cs-meta-row"><div class="cs-meta-label">Role</div><div class="cs-meta-value">${data.meta.Role}</div></div>
      <div class="cs-meta-row"><div class="cs-meta-label">Timeline</div><div class="cs-meta-value">${data.meta.Timeline}</div></div>
      <div class="cs-meta-row"><div class="cs-meta-label">Tools</div><div class="cs-meta-pills">${toolPills}</div></div>
      <div class="cs-meta-row"><div class="cs-meta-label">Type</div><div class="cs-meta-pills">${typePills}</div></div>`,
    coverBg: data.coverBg, coverUrl: null,
    content: data.sections.map(renderSection).join(''),
    prev: data.prev, next: data.next
  });
}

// ── Render from Firebase data ──
function renderFirebase(item, allItems) {
  const root = document.getElementById('cs-root');
  document.title = `${item.title} — Zacky Hilmi`;
  const toolPills = (item.tools||'').split(',').map(t => `<span class="cs-meta-pill">${t.trim()}</span>`).join('');
  // Build prev/next from list
  const idx = allItems.findIndex(i => i.slug === item.slug || i.id === item.id);
  const prev = allItems[idx - 1];
  const next = allItems[idx + 1];
  // Build content sections from flat fields
  const sections = [];
  if (item.overview) sections.push({ label: 'Overview', heading: item.title, body: item.overview });
  if (item.solution) sections.push({ label: 'Process & Solution', heading: 'Approach & execution', body: item.solution });
  if (item.outcome) sections.push({ label: 'Outcome', heading: 'Results & impact', body: item.outcome });

  root.innerHTML = buildHTML({
    tag: item.tag || '', title: item.title,
    subtitle: item.client || '', desc: item.desc || '',
    metaRows: `
      <div class="cs-meta-row"><div class="cs-meta-label">Client</div><div class="cs-meta-value">${item.client||'—'}</div></div>
      <div class="cs-meta-row"><div class="cs-meta-label">Role</div><div class="cs-meta-value">${item.role||'—'}</div></div>
      <div class="cs-meta-row"><div class="cs-meta-label">Timeline</div><div class="cs-meta-value">${item.timeline||'—'}</div></div>
      <div class="cs-meta-row"><div class="cs-meta-label">Tools</div><div class="cs-meta-pills">${toolPills}</div></div>`,
    coverBg: '#edf2f8', coverUrl: item.coverUrl || null,
    content: sections.map(renderSection).join(''),
    prev: prev ? { href: `case-study.html?id=${prev.slug||prev.id}`, title: `← ${prev.title}` } : { href: 'work.html', title: '← All Work' },
    next: next ? { href: `case-study.html?id=${next.slug||next.id}`, title: `${next.title} →` } : { href: 'work.html', title: 'All Work →' }
  });
}

function buildHTML({ tag, title, subtitle, desc, metaRows, coverBg, coverUrl, content, prev, next }) {
  const coverHtml = coverUrl
    ? `<div class="cs-cover" style="padding:0;"><img src="${coverUrl}" style="width:100%;height:100%;object-fit:cover;"></div>`
    : `<div class="cs-cover hatch-section" style="background:${coverBg};"><div style="font-size:13px;color:var(--gray-400);">[ Tambahkan screenshot project di CMS ]</div></div>`;
  return `
    <div class="cs-hero hatch-section">
      <div class="cs-hero-inner">
        <div class="cs-breadcrumb"><a href="work.html">Work</a> › ${title}</div>
        <div class="cs-hero-grid">
          <div>
            <div class="cs-tag">${tag}</div>
            <h1>${title}<br><em style="font-style:italic;font-weight:300;color:var(--gray-400);">${subtitle}</em></h1>
            <p class="cs-hero-desc">${desc}</p>
          </div>
          <div class="cs-meta-card">${metaRows}</div>
        </div>
      </div>
    </div>
    ${coverHtml}
    <div class="cs-content">
      ${content}
      <div style="text-align:center;padding-top:16px;border-top:0.5px solid var(--line);">
        <p style="font-size:13px;color:var(--gray-400);margin-bottom:16px;">Want to see the full Figma file for this project?</p>
        <a href="mailto:zackyhilmi.zh@gmail.com" style="background:var(--black);color:var(--white);font-size:13px;font-weight:500;padding:10px 20px;border-radius:20px;text-decoration:none;">Request access →</a>
      </div>
    </div>
    <div class="cs-nav">
      <a href="${prev.href}" class="cs-nav-item"><div class="cs-nav-dir">Previous</div><div class="cs-nav-title">${prev.title}</div></a>
      <a href="${next.href}" class="cs-nav-item" style="text-align:right;"><div class="cs-nav-dir">Next</div><div class="cs-nav-title">${next.title}</div></a>
    </div>`;
}

function renderNotFound(root) {
  root.innerHTML = `<div style="padding:160px 40px;text-align:center;">
    <div style="font-size:14px;color:var(--gray-400);">Case study tidak ditemukan.</div>
    <a href="work.html" style="color:var(--black);font-size:14px;margin-top:16px;display:inline-block;">← Kembali ke Work</a>
  </div>`;
}

const params = new URLSearchParams(window.location.search);
const pageId = params.get('id') || 'datasintesa';

// Try Firebase first, fallback to static
(async () => {
  try {
    const { initDB, fetchCollection } = await import('./portfolio-data.js');
    const db = await initDB();
    if (db) {
      const items = await fetchCollection('casestudies');
      if (items && items.length) {
        const item = items.find(c => c.slug === pageId || c.id === pageId);
        if (item) { renderFirebase(item, items); return; }
      }
    }
  } catch(e) { /* Firebase not available */ }
  // Static fallback
  renderStatic(pageId);
})();
